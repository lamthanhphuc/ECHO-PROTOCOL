name: Unity CI Phase 1

on:
  pull_request:
    branches: [LTP]
    paths:
      - ".github/workflows/unity-editmode.yml"
      - "scripts/check_unity_editmode_results.py"
      - "tests/test_check_unity_editmode_results.py"
      - "KLTN/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  result-gate-tests:
    name: Unity XML gate unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test result validator
        run: |
          python3 -m unittest discover \
            -s tests \
            -p "test_check_unity_editmode_results.py" \
            -v

  unity-tests:
    name: Unity ${{ matrix.mode }} (manual baseline)
    if: github.event_name == 'workflow_dispatch'
    needs: result-gate-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: EditMode
            runner: editmode
          - mode: PlayMode
            runner: playmode

    steps:
      - name: Require Unity license
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]]; then
            echo "::error::Unity license activation is not configured"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Verify LFS checkout and runner disk
        run: |
          git lfs fsck
          df -h .

      - name: Run Unity ${{ matrix.mode }} tests
        id: unity
        continue-on-error: true
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: KLTN
          unityVersion: 6000.5.8f1
          testMode: ${{ matrix.runner }}
          cliVersion: v0.1.72
          coverageEnabled: false
          artifactsPath: artifacts/${{ matrix.mode }}

      - name: Validate NUnit results
        if: always() && steps.license.outcome == 'success'
        run: |
          python3 scripts/check_unity_editmode_results.py \
            artifacts/${{ matrix.mode }} \
            "${{ steps.unity.outcome }}" \
            "${{ matrix.mode }}"

      - name: Upload Unity test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-${{ matrix.mode }}-results
          path: artifacts/${{ matrix.mode }}/
          if-no-files-found: warn
          retention-days: 14
