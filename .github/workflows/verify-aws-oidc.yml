name: Verify AWS OIDC

on:
  push:
    branches: [LTP]
    paths:
      - .github/workflows/verify-aws-oidc.yml

permissions:
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Authenticate with AWS OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ap-southeast-1
          role-to-assume: arn:aws:iam::430013477435:role/EchoProtocolGitHubOIDCDeployLTP
          allowed-account-ids: '430013477435'

      - name: Verify assumed role
        shell: bash
        run: |
          arn="$(aws sts get-caller-identity --query Arn --output text)"
          [[ "$arn" == arn:aws:sts::430013477435:assumed-role/EchoProtocolGitHubOIDCDeployLTP/* ]]
          echo "OIDC AUTHENTICATION PASS"

      - name: Verify SSM read-only preflight
        shell: bash
        run: |
          set -euo pipefail

          instance="i-00689d79dfa51a384"
          document="EchoProtocol-CD-ReadOnlyPreflight"

          command_id="$(aws ssm send-command \
            --instance-ids "$instance" \
            --document-name "$document" \
            --document-version "2" \
            --comment "GitHub CD read-only preflight" \
            --max-concurrency "1" \
            --max-errors "0" \
            --timeout-seconds 120 \
            --query "Command.CommandId" \
            --output text)"

          echo "SSM Command ID: $command_id"

          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$instance"

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$instance" \
            --query "StandardOutputContent" \
            --output text |
            grep -Fq "READ_ONLY_PREFLIGHT_PASS"

          echo "GITHUB OIDC TO SSM PREFLIGHT PASS"
