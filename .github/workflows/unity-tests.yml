name: Unity tests

on:
  push:
    branches: [main, LTP]
  pull_request:
    branches: [main, LTP]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-tests-hosted
  cancel-in-progress: false

jobs:
  unity-tests:
    name: Unity ${{ matrix.mode }}
    # Unity licensing secrets are available only to trusted repository builds.
    if: >-
      github.actor != 'dependabot[bot]' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/LTP')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [editmode, playmode]
    steps:
      - name: Free disk space for Unity
        run: |
          df -h /
          # These preinstalled SDKs are not used by the Linux Unity container.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - name: Run Unity tests
        # v4.3.2 launches Docker directly and avoids a separate CLI download.
        uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: KLTN
          unityVersion: auto
          testMode: ${{ matrix.mode }}
          artifactsPath: unity-test-results
          githubToken: ''
      - name: Verify NUnit results
        env:
          TEST_MODE: ${{ matrix.mode }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = []
          for path in Path("unity-test-results").rglob("*.xml"):
              root = ET.parse(path).getroot()
              if root.tag == "test-run":
                  reports.append(root)
          if not reports:
              raise SystemExit("Unity produced no NUnit test-run report.")
          counts = {key: sum(int(report.get(key, "0")) for report in reports)
                    for key in ("passed", "failed", "skipped", "inconclusive")}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              print(f'### Unity {os.environ["TEST_MODE"]} on {os.environ["GITHUB_SHA"]}', file=summary)
              for name, count in counts.items():
                  print(f"- {name.capitalize()}: {count}", file=summary)
          if (counts["passed"] == 0 or counts["failed"] or counts["inconclusive"]
                  or any(report.get("result") != "Passed" for report in reports)):
              raise SystemExit("Unity tests did not complete successfully.")
          PY
      - name: Upload Unity results and Editor log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: unity-test-results/
          if-no-files-found: warn
