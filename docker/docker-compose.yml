services:
  postgres:
    image: postgres:16
    container_name: echo_protocol_postgres
    environment:
      POSTGRES_DB: echo_protocol
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - echo_protocol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d echo_protocol"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  echo_protocol_pgdata:
